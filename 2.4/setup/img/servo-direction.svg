<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="15">
  <title>Servo direction check: a positive override angle must move the servo arm up, towards the swashplate</title>
  <!-- swashplate -->
  <rect x="150" y="38" width="340" height="16" rx="4" fill="#8a96a3"/>
  <text x="320" y="28" text-anchor="middle" fill="#8a96a3" font-weight="600">Swashplate</text>
  <!-- linkage to arm tip (positive position) -->
  <line x1="395" y1="54" x2="395" y2="128" stroke="#8a96a3" stroke-width="4" stroke-dasharray="7 5"/>
  <!-- servo body -->
  <rect x="210" y="170" width="200" height="90" rx="8" fill="none" stroke="#8a96a3" stroke-width="3"/>
  <text x="310" y="232" text-anchor="middle" fill="#8a96a3" font-weight="600">Servo</text>
  <circle cx="310" cy="170" r="10" fill="#8a96a3"/>
  <!-- arm at centre (0 deg) -->
  <line x1="310" y1="170" x2="410" y2="170" stroke="#8a96a3" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
  <text x="418" y="190" fill="#8a96a3">0°</text>
  <!-- arm at positive angle -->
  <line x1="310" y1="170" x2="397" y2="128" stroke="#007cc7" stroke-width="7" stroke-linecap="round"/>
  <circle cx="397" cy="128" r="6" fill="#007cc7"/>
  <!-- motion arrow -->
  <path d="M 440 176 A 132 132 0 0 0 425 120" fill="none" stroke="#007cc7" stroke-width="3" marker-end="url(#a)"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#007cc7"/>
    </marker>
  </defs>
  <text x="452" y="140" fill="#007cc7" font-weight="700">Positive override</text>
  <text x="452" y="160" fill="#007cc7">arm moves UP,</text>
  <text x="452" y="180" fill="#007cc7">towards the swashplate</text>
  <text x="40" y="290" fill="#8a96a3" font-size="13">If the arm moves down for a positive angle, tick Reverse for that servo.</text>
</svg>
