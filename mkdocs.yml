site_name: Rotorflight Documentation
site_description: Documentation for the Rotorflight helicopter flight controller firmware, Configurator, Blackbox and radio Lua suites
site_url: https://doc.rotorflight.org/
repo_url: https://github.com/rotorflight/rotorflight-documentation
repo_name: rotorflight-documentation
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/Rotorflight_outline_dark.svg # white outline variant, for contrast against the blue toolbar
  favicon: assets/favicon.ico
  font: false # use the system-font stack from extra.css instead of a fetched webfont
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
    - content.tabs.link

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

plugins:
  - search

extra_javascript:
  - javascripts/gear-calc.js

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [includes]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rotorflight
    - icon: fontawesome/brands/discord
      link: https://discord.gg/FyfMF4RwSA
    - icon: fontawesome/solid/globe
      link: https://www.rotorflight.org/

